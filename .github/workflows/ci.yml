name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check C and C++ formatting
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check clang-format==18.1.8
          .\scripts\Check-Format.ps1

  windows-x64:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-x64-debug
            clang_tidy: true
          - preset: windows-x64-release
            clang_tidy: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure, build, and test
        shell: pwsh
        env:
          PRESET: ${{ matrix.preset }}
          ENABLE_CLANG_TIDY: ${{ matrix.clang_tidy }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT

          # Runner images ship C:\vcpkg checkouts that may predate the pinned baseline or be
          # shallow clones missing it; align the registry with the pinned baseline so manifest
          # mode resolves the same versions as a local build.
          $baseline = (Get-Content -Raw vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          & git -C $env:VCPKG_ROOT cat-file -e "$baseline^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            & git -C $env:VCPKG_ROOT fetch --depth 1 origin $baseline
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          & git -C $env:VCPKG_ROOT -c advice.detachedHead=false checkout --force --quiet $baseline
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # The image's preinstalled vcpkg.exe can be newer than the pinned baseline registry
          # and refuse its vcpkg-tools.json ("document schema version 1 is not supported").
          # Rebuild vcpkg.exe from the checked-out sources so tool and registry always match.
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit 1 }

          .\scripts\Enter-NoleaxDevShell.ps1

          # Resolve a concrete ninja.exe path and pin CMAKE_MAKE_PROGRAM. Runner images have
          # shipped ninja as a shell alias (invocable in pwsh but invisible to CMake's exe
          # search) and as a dangling chocolatey shim, so every candidate must prove it runs
          # before it is trusted; a choco install does not refresh this session's PATH.
          function Test-NinjaPath([string]$candidate) {
            if ([string]::IsNullOrWhiteSpace($candidate)) { return $false }
            if (-not (Test-Path -LiteralPath $candidate)) { return $false }
            & $candidate --version 2>$null | Out-Null
            return ($LASTEXITCODE -eq 0)
          }
          $chocoRoot = $env:ChocolateyInstall
          if ([string]::IsNullOrWhiteSpace($chocoRoot)) { $chocoRoot = 'C:\ProgramData\Chocolatey' }
          $ninjaCandidates = @()
          $ninjaCommand = Get-Command ninja -ErrorAction SilentlyContinue
          if ($null -ne $ninjaCommand) {
            if ($ninjaCommand.CommandType -eq 'Alias') {
              $ninjaCandidates += $ninjaCommand.Definition
            } elseif ($ninjaCommand.Path) {
              $ninjaCandidates += $ninjaCommand.Path
            }
          }
          $ninjaCandidates += (Join-Path $env:VSINSTALLDIR 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe')
          $ninjaCandidates += (Join-Path $chocoRoot 'lib\ninja\tools\ninja.exe')
          $ninjaCandidates += (Join-Path $chocoRoot 'bin\ninja.exe')
          $ninjaPath = $null
          foreach ($candidate in $ninjaCandidates) {
            if (Test-NinjaPath $candidate) {
              $ninjaPath = $candidate
              break
            }
          }
          if (-not $ninjaPath) {
            choco install ninja --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit 1 }
            foreach ($candidate in @((Join-Path $chocoRoot 'lib\ninja\tools\ninja.exe'),
                                     (Join-Path $chocoRoot 'bin\ninja.exe'))) {
              if (Test-NinjaPath $candidate) {
                $ninjaPath = $candidate
                break
              }
            }
            if (-not $ninjaPath) { exit 1 }
          }
          Write-Host "Ninja: $ninjaPath"

          $PSNativeCommandUseErrorActionPreference = $true

          # pwsh passes each array element as a single argv entry, so the path must not carry
          # embedded quotes: a literal `"` in CMAKE_MAKE_PROGRAM makes CMake's ninja probe
          # fail with "no such file or directory".
          $configureArguments = @("-DCMAKE_MAKE_PROGRAM=$ninjaPath")
          if ($env:ENABLE_CLANG_TIDY -eq "true") {
            $llvmCandidates = @(
              "C:\Program Files\LLVM\bin",
              (Join-Path $env:VCINSTALLDIR "Tools\Llvm\x64\bin")
            )
            foreach ($llvmBin in $llvmCandidates) {
              if (Test-Path -LiteralPath (Join-Path $llvmBin "clang-tidy.exe")) {
                $env:PATH = "$llvmBin;$env:PATH"
                break
              }
            }
            clang-tidy --version
            $configureArguments += "-DNOLEAX_ENABLE_CLANG_TIDY=ON"
          }

          cmake --preset $env:PRESET @configureArguments
          cmake --build --preset $env:PRESET
          ctest --preset $env:PRESET

      - name: Package release ZIP
        if: matrix.preset == 'windows-x64-release'
        shell: pwsh
        run: |
          cpack --config .\build\windows-x64-release\CPackConfig.cmake -G ZIP
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem .\build\windows-x64-release\package\

      - name: Upload release package artifact
        if: matrix.preset == 'windows-x64-release'
        uses: actions/upload-artifact@v4
        with:
          name: noleax-windows-x64-package
          path: build/windows-x64-release/package/*.zip*
          if-no-files-found: error
          retention-days: 30

  release:
    runs-on: windows-latest
    needs: [format, windows-x64]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: noleax-windows-x64-package

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip*"

      - name: Update rolling prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: "Continuous build (main)"
          prerelease: true
          files: "*.zip*"
